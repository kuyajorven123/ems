    <!-- Page specific script -->
    <script>
        $(function () {

            var table = $("#example1").DataTable({
                responsive: true,
                lengthChange: false,
                autoWidth: false,
                buttons: [
                    "copy",
                    "csv",
                    "excel",
                    "pdf",
                    "print",
                    "colvis"
                ]
            });

            // Export buttons (left)
            table.buttons().container()
                .appendTo('#example1_wrapper .col-md-6:eq(0)');

            // Add Department dropdown before the Search box
            $('#example1_filter').prepend(`
        <label class="mr-2 mb-0">
            <select id="departmentFilter" class="form-control form-control-sm">
                <option value="">All Departments</option>
            </select>
        </label>
    `);

            // Populate Department dropdown
            var departments = [];

            table.column(5).data().each(function (value) {

                value = $('<div>').html(value).text().trim();

                if (value && departments.indexOf(value) === -1) {
                    departments.push(value);
                }

            });

            departments.sort();

            $.each(departments, function (i, department) {
                $('#departmentFilter').append(
                    `<option value="${department}">${department}</option>`
                );
            });

            // Filter table
            $('#departmentFilter').on('change', function () {
                table
                    .column(5)
                    .search($(this).val())
                    .draw();
            });

            // Second table
            $('#example2').DataTable({
                paging: true,
                lengthChange: false,
                searching: false,
                ordering: true,
                info: true,
                autoWidth: false,
                responsive: true
            });

        });
    </script>

                type: 'GET',
                success: function (user) {

                    $('#employeeId').val(user.id);
                    $('#firstname').val(user.firstname);
                    $('#middlename').val(user.middlename);
                    $('#lastname').val(user.lastname);
                    $('#address').val(user.address);
                    $('#position').val(user.position);

                    $('#birthday').val(user.birthday);
                    $('#department').val(user.department.id);
                },
                error: function () {
                    alert("Unable to load employee.");

    <!-- For Leave Applications -->
    <script>
        $('#modal-view-leave').on('show.bs.modal', function (event) {

            var button = $(event.relatedTarget);
            var id = button.data('id');

            $.ajax({
                url: '/leave_applications/' + id,
                type: 'GET',
                success: function (leave) {
                    $('#leaveId').val(leave.id);
                    $('#leaveName').text(leave.user.firstname + ' ' + leave.user.middlename + ' ' + leave.user.lastname);
                    $('#leaveDepartment').text(leave.user.department.departmentName);
                    $('#leavePosition').text(leave.user.position);
                    $('#leaveReason').text(leave.reason);
                    $('#leaveComment').text(leave.comment);
                    // Status badge
                    var statusBadge = $('#leaveStatus');

                    statusBadge.text(leave.status);

                    statusBadge.removeClass('badge-warning badge-success badge-danger');

                    if (leave.status === 'Pending') {
                        statusBadge.addClass('badge-warning');
                    }
                    else if (leave.status === 'Approved') {
                        statusBadge.addClass('badge-success');
                    }
                    else if (leave.status === 'Rejected') {
                        statusBadge.addClass('badge-danger');
                    }

                    // For the buttons and comments
                    if (leave.status === 'Pending') {
                        $('#leave-action-buttons').show();
                        $('#commentContainer').show();
                        $('#leaveCommentContainer').hide();
                    } else {
                        $('#leave-action-buttons').hide();
                        $('#commentContainer').hide();
                        $('#leaveCommentContainer').show();
                    }


                },
                error: function () {
                    alert("Unable to load admin.");
                }
            });

        });
    </script>
