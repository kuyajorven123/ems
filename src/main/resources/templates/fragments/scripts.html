    <!-- Calendar Script -->
    <script>
        $(function () {

            /* initialize the external events
             -----------------------------------------------------------------*/
            function ini_events(ele) {
                ele.each(function () {

                    // create an Event Object (https://fullcalendar.io/docs/event-object)
                    // it doesn't need to have a start or end
                    var eventObject = {
                        title: $.trim($(this).text()) // use the element's text as the event title
                    }

                    // store the Event Object in the DOM element so we can get to it later
                    $(this).data('eventObject', eventObject)

                    // make the event draggable using jQuery UI
                    $(this).draggable({
                        zIndex: 1070,
                        revert: true, // will cause the event to go back to its
                        revertDuration: 0  //  original position after the drag
                    })

                })
            }

            ini_events($('#external-events div.external-event'))

            /* initialize the calendar
             -----------------------------------------------------------------*/
            //Date for the calendar events (dummy data)
            var date = new Date()
            var d = date.getDate(),
                m = date.getMonth(),
                y = date.getFullYear()

            var Calendar = FullCalendar.Calendar;
            var Draggable = FullCalendar.Draggable;

            var containerEl = document.getElementById('external-events');
            var checkbox = document.getElementById('drop-remove');
            var calendarEl = document.getElementById('calendar');

            // initialize the external events
            // -----------------------------------------------------------------

            new Draggable(containerEl, {
                itemSelector: '.external-event',
                eventData: function (eventEl) {
                    return {
                        title: eventEl.innerText,
                        backgroundColor: window.getComputedStyle(eventEl, null).getPropertyValue('background-color'),
                        borderColor: window.getComputedStyle(eventEl, null).getPropertyValue('background-color'),
                        textColor: window.getComputedStyle(eventEl, null).getPropertyValue('color'),
                    };
                }
            });

            var calendar = new Calendar(calendarEl, {
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                themeSystem: 'bootstrap',
                //Random default events
                events: [
                    {
                        title: 'All Day Event',
                        start: new Date(y, m, 1),
                        backgroundColor: '#f56954', //red
                        borderColor: '#f56954', //red
                        allDay: true
                    },
                    {
                        title: 'Long Event',
                        start: new Date(y, m, d - 5),
                        end: new Date(y, m, d - 2),
                        backgroundColor: '#f39c12', //yellow
                        borderColor: '#f39c12' //yellow
                    },
                    {
                        title: 'Meeting',
                        start: new Date(y, m, d, 10, 30),
                        allDay: false,
                        backgroundColor: '#0073b7', //Blue
                        borderColor: '#0073b7' //Blue
                    },
                    {
                        title: 'Lunch',
                        start: new Date(y, m, d, 12, 0),
                        end: new Date(y, m, d, 14, 0),
                        allDay: false,
                        backgroundColor: '#00c0ef', //Info (aqua)
                        borderColor: '#00c0ef' //Info (aqua)
                    },
                    {
                        title: 'Birthday Party',
                        start: new Date(y, m, d + 1, 19, 0),
                        end: new Date(y, m, d + 1, 22, 30),
                        allDay: false,
                        backgroundColor: '#00a65a', //Success (green)
                        borderColor: '#00a65a' //Success (green)
                    },
                    {
                        title: 'Click for Google',
                        start: new Date(y, m, 28),
                        end: new Date(y, m, 29),
                        url: 'https://www.google.com/',
                        backgroundColor: '#3c8dbc', //Primary (light-blue)
                        borderColor: '#3c8dbc' //Primary (light-blue)
                    }
                ],
                editable: true,
                droppable: true, // this allows things to be dropped onto the calendar !!!
                drop: function (info) {
                    // is the "remove after drop" checkbox checked?
                    if (checkbox.checked) {
                        // if so, remove the element from the "Draggable Events" list
                        info.draggedEl.parentNode.removeChild(info.draggedEl);
                    }
                }
            });

            calendar.render();
            // $('#calendar').fullCalendar()

            /* ADDING EVENTS */
            var currColor = '#3c8dbc' //Red by default
            // Color chooser button
            $('#color-chooser > li > a').click(function (e) {
                e.preventDefault()
                // Save color
                currColor = $(this).css('color')
                // Add color effect to button
                $('#add-new-event').css({
                    'background-color': currColor,
                    'border-color': currColor
                })
            })
            $('#add-new-event').click(function (e) {
                e.preventDefault()
                // Get value and make sure it is not null
                var val = $('#new-event').val()
                if (val.length == 0) {
                    return
                }

                // Create events
                var event = $('<div />')
                event.css({
                    'background-color': currColor,
                    'border-color': currColor,
                    'color': '#fff'
                }).addClass('external-event')
                event.text(val)
                $('#external-events').prepend(event)

                // Add draggable funtionality
                ini_events(event)

                // Remove event from text input
                $('#new-event').val('')
            })
        })
    </script>




    <!-- Table Script -->
    <script>
        $(function () {

            var table = $("#example1").DataTable({
                responsive: true,
                lengthChange: false,
                autoWidth: false,
                buttons: [
                    "copy",
                    "csv",
                    "excel",
                    "pdf",
                    "print",
                    "colvis"
                ]
            });

            // Export buttons (left)
            table.buttons().container()
                .appendTo('#example1_wrapper .col-md-6:eq(0)');

            // Add Department dropdown before the Search box
            $('#example1_filter').prepend(`
        <label class="mr-2 mb-0">
            <select id="departmentFilter" class="form-control form-control-sm">
                <option value="">All Departments</option>
            </select>
        </label>
    `);

            // Populate Department dropdown
            var departments = [];

            table.column(5).data().each(function (value) {

                value = $('<div>').html(value).text().trim();

                if (value && departments.indexOf(value) === -1) {
                    departments.push(value);
                }

            });

            departments.sort();

            $.each(departments, function (i, department) {
                $('#departmentFilter').append(
                    `<option value="${department}">${department}</option>`
                );
            });

            // Filter table
            $('#departmentFilter').on('change', function () {
                table
                    .column(5)
                    .search($(this).val())
                    .draw();
            });

            // Second table
            $('#example2').DataTable({
                paging: true,
                lengthChange: false,
                searching: false,
                ordering: true,
                info: true,
                autoWidth: false,
                responsive: true
            });

        });
    </script>

    <!-- For Leave Applications -->
    <script>
        $('#modal-view-leave').on('show.bs.modal', function (event) {

            var button = $(event.relatedTarget);
            var id = button.data('id');

            $.ajax({
                url: '/leave_applications/' + id,
                type: 'GET',
                success: function (leave) {
                    $('#leaveId').val(leave.id);
                    $('#leaveName').text(leave.user.firstname + ' ' + leave.user.middlename + ' ' + leave.user.lastname);
                    $('#leaveDepartment').text(leave.user.department.departmentName);
                    $('#leavePosition').text(leave.user.position);
                    $('#leaveReason').text(leave.reason);
                    $('#leaveDateApplied').text(formatDate(leave.dateApplied));
                    $('#leaveStartDate').text(formatDate(leave.startDate));
                    $('#leaveEndDate').text(formatDate(leave.endDate));
                    $('#leaveTotalDays').text(leave.totalDays);
                    if (leave.processedBy) {
                        $('#leaveProcessedBy').text(leave.processedBy.firstname + ' ' + leave.processedBy.middlename + ' ' + leave.processedBy.lastname);
                    } else {
                        $('#leaveProcessedBy').text('Not processed');
                    }

                    if (leave.comment) {
                        $('#leaveComment').text(leave.comment);
                    } else {
                        $('#leaveComment').text('No comment provided');
                    }




                    // Status badge
                    var statusBadge = $('#leaveStatus');

                    statusBadge.text(leave.status);

                    statusBadge.removeClass('badge-warning badge-success badge-danger');

                    if (leave.status === 'Pending') {
                        statusBadge.addClass('badge-warning');
                    }
                    else if (leave.status === 'Approved') {
                        statusBadge.addClass('badge-success');
                    }
                    else if (leave.status === 'Rejected') {
                        statusBadge.addClass('badge-danger');
                    }

                    // For the buttons and comments
                    if (leave.status === 'Pending') {
                        $('#leave-action-buttons').show();
                        $('#commentContainer').show();
                        $('#leaveCommentContainer').hide();
                        $('#leaveProcessedByContainer').hide();
                    } else {
                        $('#leave-action-buttons').hide();
                        $('#commentContainer').hide();
                        $('#leaveCommentContainer').show();
                        $('#leaveProcessedByContainer').show();
                    }


                },
                error: function () {
                    alert("Unable to load admin.");
                }
            });

        });
    </script>

    <!-- Apply Leave View Modal -->
    <script>
        function formatDate(dateString) {
            if (!dateString) return '';

            const [year, month, day] = dateString.split('-');

            const date = new Date(year, month - 1, day);

            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: '2-digit'
            });
        }

                    } else {

                    if (leave.comment) {

                    // Status badge

                    // For the buttons and comments

                        $('#myLeaveCommentContainer').hide();

                    } else {
