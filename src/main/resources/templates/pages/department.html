<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main-layout}" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0">Departments</h1>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger">
            Department Already Exist!
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>

        <div th:if="${param.success}" class="alert alert-success">
            Department Successfully Created!
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>

        <div th:if="${param.update_success}" class="alert alert-success">
            Department Successfully Updated!
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>

        <div th:if="${param.delete_success}" class="alert alert-success">
            Department Deleted Successfully!
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>
        <!-- /Alerts -->

        <div class="card">
            <div class="card-header">
                <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#modal-add-department"><i
                        class="fas fa-plus"></i>
                    Add Department</button>
            </div>
            <!-- /.card-header -->
            <div class="card-body">
                <table id="example1" class="table table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>Department Name</th>
                            <th>Tools</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="departments : ${department}">
                            <td th:text="${departments.departmentName}"></td>
                            <td>
                                <button class="btn btn-sm btn-success" data-toggle="modal"
                                    data-target="#modal-edit-department" th:data-id="${departments.id}"><i
                                        class="fas fa-edit"></i> Edit</button>
                                <button class="btn btn-sm btn-danger" data-toggle="modal"
                                    data-target="#modal-delete-department" th:data-id="${departments.id}"><i
                                        class="fas fa-trash"></i> Delete</button>
                            </td>
                        </tr>
                        </tfoot>
                </table>
            </div>
            <!-- /.card-body -->
        </div>

        <!-- Add Department Modal -->
        <div class="modal fade" id="modal-add-department">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Add Department</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/create_department}" method="post">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <label for="departmentName">Department Name</label>
                                            <input type="text" class="form-control" name="departmentName"
                                                placeholder="Enter department's name" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer justify-content-between">
                                <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Department Modal -->
        <div class="modal fade" id="modal-edit-department">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Edit Department</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/update_department}" method="post">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="form-group">

                                            <input type="hidden" id="departmentId" name="id">
                                            <!-- Column 1 -->
                                            <label for="editDepartment">Department Name</label>
                                            <input type="text" class="form-control" id="department" name="departmentName"
                                                placeholder="Enter department's name" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer justify-content-between">
                                <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Admin Modal -->
        <div class="modal fade" id="modal-delete-department">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Delete Employee</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <form th:action="@{/delete_department}" method="post">
                        <div class="modal-body">
                            <input type="hidden" id="deleteDepartmentId" name="id">
                            <p>Are you sure you want to delete this department?</p>
                            <p>Department: <b><span id="deleteDepartmentName"></span></b></p>
                        </div>
                        <div class="modal-footer justify-content-between">
                            <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-danger">Yes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
