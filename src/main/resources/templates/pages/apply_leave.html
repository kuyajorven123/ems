<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main-layout}" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS Corporation</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0">Apply Leave</h1>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <button type="button" class="btn btn-sm btn-primary" data-toggle="modal"
                    data-target="#modal-apply-leave"><i class="fas fa-plus"></i> Apply Leave</button>
            </div>
            <!-- /.card-header -->
            <div class="card-body">
                <table id="example3" class="table table-bordered table-striped">
                    <thead>
                        <tr>
                            <th>Leave Type</th>
                            <th>Date Applied</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Reason</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="leaves : ${leave}">
                            <td th:text="${leaves.leaveType}"></td>
                            <td th:text="${#temporals.format(leaves.dateApplied, 'MMMM dd, yyyy')}"></td>
                            <td th:text="${#temporals.format(leaves.startDate, 'MMMM dd, yyyy')}"></td>
                            <td th:text="${#temporals.format(leaves.endDate, 'MMMM dd, yyyy')}"></td>
                            <td th:text="${leaves.totalDays}"></td>
                            <td th:text="${leaves.reason}"></td>
                            <td><span class="badge badge-warning" th:if="${leaves.status == 'Pending'}">
                                    Pending
                                </span>

                                <span class="badge badge-success" th:if="${leaves.status == 'Approved'}">
                                    Approved
                                </span>

                                <span class="badge badge-danger" th:if="${leaves.status == 'Rejected'}">
                                    Rejected
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- /.card-body -->
        </div>
        <div class="modal fade" id="modal-apply-leave">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Apply Leave</h4>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/leave_apply}" method="post">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <!-- Column 1 -->
                                            <label for="firstname">Leave Type</label>
                                            <input type="text" class="form-control" name="leaveType"
                                                placeholder="Enter Leave Type" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <!-- Column 2  -->
                                            <label for="middlename">Start Date</label>
                                            <input type="date" class="form-control" name="startDate" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="firstname">End Date</label>
                                            <input type="date" class="form-control" name="endDate" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="middlename">Reason</label>
                                            <textarea class="form-control" name="reason" required></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    </div>
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Apply</button>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
